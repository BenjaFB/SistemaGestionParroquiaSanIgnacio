server.port=8080
spring.application.name=parroquia-san-ignacio

# ============ BASE DE DATOS: MySQL (XAMPP) ============
# createDatabaseIfNotExist=true crea la BD sola si no existe
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/db_parroquia?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Hibernate crea/actualiza las tablas automáticamente (no necesitas los .sql)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

