<body class="min-h-screen flex items-center justify-center p-gutter">
<main class="relative z-10 w-full max-w-md">
<!-- Main Login Card -->
<div class="login-card bg-surface-container-lowest rounded-[1.5rem] overflow-hidden border-t-4 border-secondary-container">
<!-- Card Header -->
<div class="px-margin-desktop pt-10 pb-6 text-center">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container mb-4">
<span class="material-symbols-outlined text-primary-fixed text-4xl" data-icon="account_balance">account_balance</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Portal Administrativo</h1>
<p class="font-body-md text-on-surface-variant mt-2">Acceso seguro para la gestión institucional</p>
</div>
<!-- Form Body -->
<form class="px-margin-desktop pb-8" id="loginForm" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="mb-5">
<label class="block font-label-md text-on-surface mb-2" for="email">Correo Electrónico</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="email" name="email" placeholder="nombre@institucion.org" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="mb-8">
<div class="flex justify-between items-center mb-2">
<label class="block font-label-md text-on-surface" for="password">Contraseña</label>
<a class="font-label-sm text-secondary hover:underline transition-all" href="#">Olvidé mi contraseña</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full flex items-center justify-center gap-3 bg-primary-container text-white py-4 px-6 rounded-lg font-label-md text-label-md uppercase tracking-wider glow-on-hover active:scale-95 transition-all" id="submitBtn" type="submit">
<span>INICIAR SESIÓN</span>
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_right_alt">arrow_right_alt</span>
</button>
</form>
<!-- Card Footer -->
<div class="bg-surface-container-high py-6 px-margin-desktop flex justify-center">
<a class="flex items-center gap-2 font-label-md text-on-surface-variant hover:text-primary transition-colors group" href="../index.html">
<span class="material-symbols-outlined group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>
                Volver al Inicio
            </a>
</div>
</div>
<!-- System Branding / Context Text -->
<div class="mt-8 text-center space-y-2">
<p class="font-label-sm text-on-surface-variant/60">
            © 2024 Gestión Pastoral Jesuita. <br/>
            Uso exclusivo para personal autorizado.
        </p>
</div>
</main>
<script src="../js/api.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const inputs = document.querySelectorAll('input');

        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.01]');
            });
        });

        const submitBtn = document.getElementById('submitBtn');
        const loginForm = document.getElementById('loginForm');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const correo = document.getElementById('email').value.trim();
            const contrasena = document.getElementById('password').value;

            const originalContent = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Validando...';
            submitBtn.disabled = true;

            try {
                // Login real contra service-usuarios (puerto 8081)
                const usuario = await apiFetch(`${API.USUARIOS}/login`, 'POST', { correo, contrasena });
                guardarSesion(usuario);

                // Redirección según rol
                const rol = (usuario.rol || '').toUpperCase();
                if (rol.includes('ADMIN')) {
                    window.location.href = 'admin.html';
                } else if (rol.includes('SUPERVISOR') || rol.includes('STAFF')) {
                    window.location.href = 'supervisor.html';
                } else {
                    window.location.href = '../index.html';
                }
            } catch (err) {
                alert('Error al iniciar sesión: ' + err.message);
                submitBtn.innerHTML = originalContent;
                submitBtn.disabled = false;
            }
        });
    });
</script>
